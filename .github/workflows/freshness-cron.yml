name: Data freshness scheduler

# Drives the data-freshness jobs on a schedule so the app self-maintains its
# clinic / doctor / visa / regulatory data with no human in the routine loop.
# Also carries pure hygiene/expiry jobs (passport grants, config changes,
# guardian sessions, rate-limit buckets — hourly/6h) and the daily doctor +
# companion trust-score refresh: none of these are life-safety escalation
# (that's safety-cron.yml), so they use this file's lighter FAILED-list
# reporting rather than that file's louder BROKEN/UNDEPLOYED/daily-audit
# alarm — don't mix the two, it would dilute the safety file's alarm signal.
#
# ONE-TIME SETUP (the only manual step):
#   1. Pick a long random string as the shared secret.
#   2. GitHub → repo Settings → Secrets and variables → Actions → New secret:
#        name: CRON_SECRET   value: <that string>
#   3. Base44 → project env vars: CRON_SECRET = <the same string>
#   After that this runs itself; nothing else to touch.
#
# Until the GitHub secret is set, scheduled runs SKIP harmlessly (green, with a
# warning annotation) instead of failing — so a missing secret never shows a red X.
#
# Optional overrides (repo Variables, only if the app URL/id ever change):
#   FUNCTIONS_BASE_URL (default https://sentinel-dental-care.base44.app)
#   BASE44_APP_ID      (default 6a01c1305c540b75f24dd373)

on:
  schedule:
    - cron: '0 * * * *'   # hourly — passport/config/guardian-session expiry (hygiene)
    - cron: '0 */6 * * *' # every 6h — rate-limit bucket cleanup (hygiene)
    - cron: '0 6 * * *'   # daily 06:00 UTC — clinic/doctor/regulatory/trust-score
    - cron: '0 7 * * 1'   # weekly Monday 07:00 UTC — visa
  workflow_dispatch:       # manual "Run workflow" button runs everything

concurrency:
  group: freshness-cron
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ vars.FUNCTIONS_BASE_URL || 'https://sentinel-dental-care.base44.app' }}
      APP: ${{ vars.BASE44_APP_ID || '6a01c1305c540b75f24dd373' }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard — secret configured
        id: guard
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::CRON_SECRET is not set as a GitHub repository secret — skipping this run (no failure). Add it under Settings → Secrets and variables → Actions with the SAME value as the Base44 env var. See this workflow's header."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run freshness jobs
        if: steps.guard.outputs.configured == 'true'
        run: |
          set +e
          call () {
            local fn="$1"
            local code
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "$BASE/api/apps/$APP/functions/$fn" \
              -H 'Content-Type: application/json' \
              -H "X-Cron-Secret: $SECRET" \
              -d '{}')
            echo "=== $fn -> HTTP $code ==="
            head -c 600 /tmp/out.json; echo
            if [ "$code" -ge 400 ]; then FAILED="$FAILED $fn"; fi
          }

          IS_HOURLY="${{ github.event.schedule == '0 * * * *' }}"
          IS_SIX_HOURLY="${{ github.event.schedule == '0 */6 * * *' }}"
          IS_WEEKLY="${{ github.event.schedule == '0 7 * * 1' }}"
          MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

          if [ "$IS_HOURLY" = "true" ] && [ "$MANUAL" != "true" ]; then
            # Hourly slot: pure hygiene/expiry jobs — complete code, just never scheduled before.
            call expirePassportGrants
            call expireConfigChanges
            call cleanupExpiredGuardianSessions
            # These three each say "every 30 min" in their own header — real,
            # gated, and each one is idempotent off a one-time *_sent_at flag,
            # so running them hourly instead only means up to ~30 extra
            # minutes before the flag gets set, never a duplicate send. Not
            # worth a brand-new 30-min schedule trigger (double the workflow
            # runs/day) for a business nudge, not a life-safety escalation.
            call autoPartnerPortalDelivery      # was never scheduled — real, correct, portal/proposal link delivery
            call autoTriggerDoctorVerification  # was never scheduled — real, correct, auto-starts AI doc verification
            call checkStalledSignups            # was never scheduled — real, correct, one-shot signup-abandon nudge
            # Header says "every 2 hours" — same reasoning as above: every
            # branch here is gated on a one-time *_sent/*_released_at flag
            # (see checkAbandonedBookings' own header), so hourly just checks
            # the 2h/24h/48h thresholds sooner, it cannot double-send.
            call checkAbandonedBookings          # was never scheduled — real, correct, 3-stage abandoned-payment recovery
          elif [ "$IS_SIX_HOURLY" = "true" ] && [ "$MANUAL" != "true" ]; then
            # 6-hourly slot: rate-limit bucket cleanup (pure DB hygiene, per its own header comment).
            call purgeRateLimitBuckets
          elif [ "$IS_WEEKLY" = "true" ] && [ "$MANUAL" != "true" ]; then
            # Weekly slot: visa only.
            call recheckVisaRequirements
          else
            # Daily slot (and manual runs): clinic + doctor + regulatory + partner trust scores.
            call backfillClinicsFromDoctors
            call verifyClinicStatus
            call reVerifyDoctorCredentials
            call detectRegulatoryChanges
            call calculateDoctorTrustScore
            call calculateCompanionScore
            call calculateDriverTrustScore
            # Marketplace: chase doctors who were invited to quote but haven't yet (link-only).
            call remindPendingQuotes
            # All four below say "run daily" in their own header and are
            # gated on exact-day-boundary flags (daysLeft === 7/3/1/0, etc.)
            # — real, correct, complete code that was simply never scheduled.
            call sendPaymentReminders        # 7/3/1-day balance-due reminders
            call sendProcedurePrepReminders  # 7/3/1/0-day M Prep Coach nudges
            call expireDoctorVerifications   # expires overdue license verifications + 30-day renewal reminders
            call sendQuoteReminders          # travel-agency/chauffeur 24h/48h/72h quote reminders — no per-send flag of its own, so keep this one at daily (not folded into the hourly tier like its siblings above) to avoid re-sending within the same stage window
            # On manual runs, also refresh visa and hygiene jobs so a full pass is one click.
            if [ "$MANUAL" = "true" ]; then
              call recheckVisaRequirements
              call expirePassportGrants
              call expireConfigChanges
              call cleanupExpiredGuardianSessions
              call purgeRateLimitBuckets
              call autoPartnerPortalDelivery
              call autoTriggerDoctorVerification
              call checkStalledSignups
              call checkAbandonedBookings
            fi
          fi

          if [ -n "$FAILED" ]; then
            echo "::warning::Some jobs returned an error:$FAILED (often just exhausted integration credits — check Base44)."
          fi
          echo "Done."
