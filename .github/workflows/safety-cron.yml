name: Safety monitor scheduler

# Drives the safety escalation jobs on a schedule.
#
# WHY THIS EXISTS
# ---------------
# Every patient-facing surface promises continuous watching ("24/7 support
# watching" on the quotes page, "Never Alone" throughout). The escalation
# engine that makes that true — 2h nudge, 3h guardian alert, 5h security
# dispatch, 9h emergency — existed and worked, but nothing scheduled it.
# escalateSoloCheckIn additionally required an ADMIN SESSION, so it could only
# ever run when a human opened /admin and pressed a button. A patient overdue
# at 3am was escalated whenever someone next looked.
#
# This closes the gap between the promise and the machinery.
#
# ONE-TIME SETUP — identical to freshness-cron.yml, same secret:
#   1. GitHub → Settings → Secrets and variables → Actions → CRON_SECRET
#   2. Base44 → project env vars → CRON_SECRET (the SAME value)
# Until the GitHub secret is set, runs SKIP harmlessly (green + warning) rather
# than failing, so a missing secret never shows a red X.
#
# HONEST LIMITATION — READ THIS
# -----------------------------
# GitHub Actions scheduled runs are BEST EFFORT. They are frequently delayed
# 5-15 minutes under load and can occasionally be dropped entirely. That is
# acceptable for the thresholds here, which are measured in HOURS (2/3/5/9), so
# a late run still escalates within the right window. It is NOT a hard
# real-time guarantee, and it should not be described to patients as one.
#
# If Base44's native scheduler is available, running these there as well is
# strictly better — every job below is idempotent (see the concurrency note),
# so belt-and-braces cannot double-alert anyone.
#
# TWO KINDS OF FAILURE — WHY THE CADENCES DIFFER
# ----------------------------------------------
# A DEPLOYED job that starts failing (403/500/402) is new information and fails
# the run immediately, on every tick.
#
# A job that was NEVER CREATED in Base44 (404) is equally serious but does not
# change between ticks, and only a human in the Base44 dashboard can fix it.
# It is reported on every tick and fails hard on the daily 09:00 audit, which
# names every missing function.
#
# This is a safety decision, not a cosmetic one. The fast ticks run ~96×/day
# and each failure emails the operator. Repeating an unchanged blocker at that
# rate does not add urgency — it trains the reader to swipe past safety-cron
# mail, and the message they then miss is the one saying the escalation ladder
# broke five minutes ago. Nothing is silenced: no failing path is closed, every
# undeployed function is visible in every run, and the daily audit is red until
# they are live.
#
# IDEMPOTENCY
# -----------
# Each job is a state machine gated on current status (pending → escalated_2h →
# escalated_3h → …). A second pass inside the same window re-reads the new
# status and does nothing. Overlapping runs — from this workflow, a Base44
# schedule, or an admin pressing the button — cannot double-notify a guardian.
#
# Optional overrides (repo Variables, only if the app URL/id change):
#   FUNCTIONS_BASE_URL (default https://sentinel-dental-care.base44.app)
#   BASE44_APP_ID      (default 6a01c1305c540b75f24dd373)

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — check-in + location + handshake escalation
    - cron: '0 * * * *'      # hourly — recovery check-ins
    - cron: '0 */6 * * *'    # every 6h — anomaly analysis (LLM, costs credits)
    - cron: '0 9 * * *'      # daily 09:00 UTC — deployment audit (see DAILY below)
  workflow_dispatch:
    inputs:
      run_ai_analysis:
        description: 'Also run runSafetyMonitor (calls an LLM — costs integration credits)'
        type: boolean
        default: false

concurrency:
  group: safety-cron
  cancel-in-progress: false

jobs:
  safety:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ vars.FUNCTIONS_BASE_URL || 'https://sentinel-dental-care.base44.app' }}
      APP: ${{ vars.BASE44_APP_ID || '6a01c1305c540b75f24dd373' }}
      SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard — secret configured
        id: guard
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::CRON_SECRET is not set as a GitHub repository secret — SAFETY MONITORING IS NOT RUNNING. Add it under Settings → Secrets and variables → Actions with the SAME value as the Base44 env var. See this workflow's header."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run safety jobs
        if: steps.guard.outputs.configured == 'true'
        run: |
          set +e
          # Two DIFFERENT conditions, deliberately kept apart.
          #
          # BROKEN   — the function is live and something is wrong RIGHT NOW
          #            (bad secret, old code, credits gone). New information,
          #            possibly a regression that just landed. Alarm instantly.
          #
          # UNDEPLOYED — the function was never created in Base44. True, serious,
          #            and completely unchanged since the last tick. Only a human
          #            in the Base44 dashboard can change it.
          #
          # Both mean patients are not monitored and both still FAIL the build.
          # The difference is cadence, and that is a safety decision, not a
          # cosmetic one: this workflow fires ~96×/day, each failure sends an
          # email, and an operator who has learned to swipe past safety-cron
          # mail will swipe past the one that says the escalation ladder just
          # broke. A standing blocker repeated every 15 minutes doesn't add
          # urgency — it buries the alarm that does. So the standing blocker
          # reports once a day (still red, still exit 1, still names every
          # missing function) and the fast ticks stay quiet unless something
          # genuinely changed.
          #
          # Nothing here is silenced and no failing path is closed: an
          # undeployed function is reported on EVERY tick as a ::notice::, and
          # is a hard failure on the daily audit.
          BROKEN=""
          UNDEPLOYED=""
          call () {
            local fn="$1"
            local code
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "$BASE/api/apps/$APP/functions/$fn" \
              -H 'Content-Type: application/json' \
              -H "X-Cron-Secret: $SECRET" \
              -d '{}')
            echo "=== $fn -> HTTP $code ==="
            head -c 600 /tmp/out.json; echo
            if [ "$code" = "404" ]; then
              UNDEPLOYED="$UNDEPLOYED $fn"
              echo "::notice::$fn is not deployed to Base44 — that safety path is dead. Reported in full by the daily audit."
            elif [ "$code" -ge 400 ]; then
              BROKEN="$BROKEN $fn"
            fi
          }

          HOURLY="${{ github.event.schedule == '0 * * * *' }}"
          SIX_HOURLY="${{ github.event.schedule == '0 */6 * * *' }}"
          DAILY="${{ github.event.schedule == '0 9 * * *' }}"
          MANUAL="${{ github.event_name == 'workflow_dispatch' }}"

          if [ "$DAILY" = "true" ] && [ "$MANUAL" != "true" ]; then
            # Deployment audit. Calls every life-safety job so the UNDEPLOYED
            # list below is complete rather than whatever this tick happened to
            # touch. These are all idempotent state machines gated on current
            # status (see header), so a duplicate pass escalates nothing twice
            # and does real work if they ARE live. runSafetyMonitor is excluded
            # on purpose — it is the only job that bills an LLM, and a daily
            # deployment check must not cost money to answer "is it deployed".
            call scheduleSoloCheckIns
            call escalateSoloCheckIn
            call predictiveEscalation
            call checkStaleLiveLocations
            call escalateMissedDriverHandshake
            call detectFallbackCrisis
            call checkPartnerSLABreaches
            call dispatchSoloSecurity
            call checkMissedRecoveryCheckins
            call sendActivityNudge
            call sendMilestoneWhatsAppCheckIns
            call sendTravelCountdownReminders  # real, correct, was never scheduled until now — 14/7/3/1/0-day departure milestones
            call autoCompletePatientJourney    # real, correct, was never scheduled until now — Recovery -> Completed state transition
            call checkJourneyWeather           # M-Care Weather Guardian — daily destination briefing; severity doubles as a real-time severe-weather alert
            call runGuardianCheckInSweep       # Silent Guardian am/pm check-in — real send, was never wired to anything, client or server, until now
            call retryDriverLocationSms        # driver-location-share reminder/care-team-alert — real, cronAuthorized-gated, was never wired to anything until now
          elif [ "$SIX_HOURLY" = "true" ] && [ "$MANUAL" != "true" ]; then
            # Anomaly analysis calls an LLM, so it runs on the slowest cadence.
            call runSafetyMonitor
          elif [ "$HOURLY" = "true" ] && [ "$MANUAL" != "true" ]; then
            call checkMissedRecoveryCheckins
            call sendActivityNudge
          else
            # Every 15 min — the life-safety path.
            call scheduleSoloCheckIns           # creates/advances check-ins for every active traveler, not just solo
            call sendMilestoneWhatsAppCheckIns  # sends the WhatsApp/email check-in for any milestone scheduleSoloCheckIns just created that's now due
            call escalateSoloCheckIn            # 2h → 3h → 5h → 9h cascade
            call predictiveEscalation           # fires BEFORE a check-in is missed
            call checkStaleLiveLocations        # GPS gone quiet
            call escalateMissedDriverHandshake  # driver no-show → reroute
            call detectFallbackCrisis           # doctor unconfirmed as procedure nears → auto-backup
            call checkPartnerSLABreaches        # partner quiet 24h/48h → auto backup + admin escalate
            call dispatchSoloSecurity           # solo traveler 5h+ unresponsive → security welfare check
            call runGuardianCheckInSweep        # Silent Guardian am/pm check-in — 9am/9pm local time, per opted-in traveler
            # retryDriverLocationSms's own thresholds (3-min reminder, 5-min
            # care-team alert) assume near-minute granularity — GitHub Actions
            # cron can't reliably go below ~5 min, so the 15-min tick here can
            # miss the narrow 3-5-min reminder window entirely on an unlucky
            # dispatch time. The open-ended 5+-min care-team alert is NOT
            # affected — it still fires reliably on the next tick either way.
            call retryDriverLocationSms         # driver-location-share reminder/care-team-alert
            if [ "$MANUAL" = "true" ]; then
              call checkMissedRecoveryCheckins
              # runSafetyMonitor is the ONLY job here that calls an LLM, so it
              # is the only one that costs integration credits per invocation.
              # It used to run on every manual dispatch, which meant testing the
              # scheduler quietly spent money each click. It is analysis, not
              # life-safety — nobody is unmonitored if it is skipped — so it is
              # now opt-in via the run_ai_analysis input.
              if [ "${{ inputs.run_ai_analysis }}" = "true" ]; then
                call runSafetyMonitor
              else
                echo "=== runSafetyMonitor -> SKIPPED (costs LLM credits; tick 'run_ai_analysis' to include) ==="
              fi
            fi
          fi

          echo ""
          echo "How to read the HTTP codes above:"
          echo "  404 — function is not published to Base44. Create/publish it."
          echo "  500 — published, but running PRE-cronAuth code: it calls"
          echo "        base44.auth.me() before checking the header, which throws"
          echo "        with no session. No scheduler can drive it. Publish the fix."
          echo "  403 — published with the guard, but CRON_SECRET does not match"
          echo "        between GitHub and Base44."
          echo "  402 — Base44 integration credits exhausted."
          echo ""

          STATUS=0

          # A live job that just failed. Always immediate — this is the signal
          # the whole workflow exists to deliver, and it must never be sitting
          # behind a day's worth of standing-blocker mail.
          if [ -n "$BROKEN" ]; then
            # Deliberately an ERROR, not a warning. A green tick on a run where
            # safety jobs failed is the same class of problem this workflow was
            # written to fix: a monitor that reports success while not
            # monitoring. If these fail, nobody is being watched — say so loudly.
            echo "::error::SAFETY JOBS FAILED:$BROKEN — these are DEPLOYED and erroring. Patients are NOT being monitored until this is resolved."
            STATUS=1
          fi

          if [ -n "$UNDEPLOYED" ]; then
            if [ "$DAILY" = "true" ] || [ "$MANUAL" = "true" ]; then
              echo "::error::NOT DEPLOYED TO BASE44:$UNDEPLOYED"
              echo "::error::Each name above is a safety path with nothing running behind it. Create these in the Base44 dashboard — repo sync does not create edge functions."
              STATUS=1
            else
              # Reported on every tick as a notice (visible in the run, no
              # email), failed properly once a day. Same fact, told at a
              # cadence that keeps it readable.
              echo "::warning::Not deployed:$UNDEPLOYED — dead safety paths. The daily 09:00 audit fails on these; this tick does not re-alarm."
            fi
          fi

          if [ -n "$BROKEN" ] || [ -n "$UNDEPLOYED" ]; then
            echo ""
            echo "BROKEN (deployed, failing):$BROKEN"
            echo "UNDEPLOYED (never created):$UNDEPLOYED"
          fi

          exit $STATUS
          echo "Done."
